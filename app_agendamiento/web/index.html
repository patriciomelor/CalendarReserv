<!DOCTYPE html>
<html>
  <head>
    <base href="$FLUTTER_BASE_HREF">

    <meta charset="UTF-8">
    <meta content="IE=Edge" http-equiv="X-UA-Compatible">
    <meta name="description" content="Agend.app - Tu app de agendamiento.">

    <!-- iOS meta tags & icons -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Agend.app">
    <link rel="apple-touch-icon" href="icons/Icon-192.png">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png" />

    <title>Agend.app</title>
    <link rel="manifest" href="manifest.json">
  </head>
  <body>
    <!-- Carga primero Flutter -->
    <script src="flutter_bootstrap.js" async></script>
    
    <!-- Luego registra el Service Worker para notificaciones -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/firebase-messaging-sw.js')
            .then((registration) => {
              console.log('✅ Service Worker registrado:', registration.scope);
            })
            .catch((err) => {
              console.error('❌ Error al registrar Service Worker:', err);
            });
        });
      } else {
        console.warn('⚠️ Service Worker no soportado en este navegador');
      }
    </script>
  </body>
</html>
